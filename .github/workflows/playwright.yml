name: Playwright API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: API / ${{ matrix.suite }}
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false # a failing suite must not cancel the others
      matrix:
        suite: [contract, pagination, filters, errors]

    # Each matrix job gets its own isolated API container
    services:
      engagesphere:
        image: wlsf82/engagesphereserver:amd64
        ports:
          - 3001:3001

    env:
      # The `||` fallback covers forks and unset secrets (see notes below)
      API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://localhost:3001' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/customers > /dev/null; then
              echo "API is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready in time"
          exit 1

      - name: Run ${{ matrix.suite }} suite
        run: npx playwright test --project=api customers.${{ matrix.suite }}

      - name: Print API logs on failure
        if: failure()
        run: docker logs $(docker ps -aq --filter ancestor=wlsf82/engagesphereserver:amd64)

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload traces and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
