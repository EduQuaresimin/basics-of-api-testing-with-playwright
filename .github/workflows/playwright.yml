name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

  api-tests:
    name: API / ${{ matrix.suite }}
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # one failing suite must not cancel the others
      matrix:
        suite: [contract, pagination, filters, errors]

    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the API
        run: docker run -d --name engagesphere -p 3001:3001 wlsf82/engagesphereserver:amd64

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/customers > /dev/null; then
              echo "API is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready in time"
          docker logs engagesphere
          exit 1

      - name: Run ${{ matrix.suite }} suite
        run: npx playwright test --project=api customers.${{ matrix.suite }}

      - name: Print API logs on failure
        if: failure()
        run: docker logs engagesphere

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
